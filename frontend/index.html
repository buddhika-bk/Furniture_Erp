<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E1A">
<title>Aurum ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Outfit', 'Inter', 'sans-serif'] },
    colors: {
      gold: {           /* kept for backwards-compatible class names in schema.js/pages.js, remapped to dark palette */
        50:'#0F1524', 100:'#131A2A', 200:'#1F2A40', 300:'#2A3752', 400:'#3F4D6E',
        500:'#6366F1', 600:'#818CF8', 700:'#A5B4FC', 800:'#CBD5E1', 900:'#F1F5F9'
      },
      ink: '#F1F5F9'
    }
  } } };
</script>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="font-sans antialiased">

<!-- ================= Sign in ================= -->
<section id="login" class="min-h-screen grid lg:grid-cols-2 bg-bg-base">
  <div class="hidden lg:flex flex-col justify-between p-12 brand-hero relative overflow-hidden">
    <div class="font-display text-3xl font-extrabold tracking-tight relative z-10">
      <span class="brand-mark">W</span> Webpoint One
    </div>
    <div class="relative z-10">
      <div class="chip-eyebrow">Integrated ERP</div>
      <h1 class="font-display text-5xl leading-tight font-extrabold max-w-md mt-4">
        From loom to showroom,<br><span class="grad-text">in one ledger.</span>
      </h1>
      <p class="mt-5 max-w-sm text-slate-300/80">Factory production, five showrooms and head office share one stock, cost and sales record.</p>
    </div>
    <div class="text-sm text-slate-400/80 relative z-10">Factory · Showrooms · Head office</div>
    <div class="hero-grid"></div>
    <div class="hero-glow"></div>
  </div>
  <div class="flex items-center justify-center p-6 bg-bg-base">
    <form id="loginForm" class="w-full max-w-sm space-y-5 glass-card" autocomplete="on">
      <div class="lg:hidden font-display text-3xl font-extrabold grad-text">Webpoint One</div>
      <div>
        <h2 class="font-display text-3xl font-extrabold text-white">Sign in</h2>
        <p class="text-sm text-slate-400 mt-1">Use your work email to continue.</p>
      </div>
      <div id="loginError" class="hidden rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm px-4 py-3"></div>
      <label class="block"><span class="lbl">Email</span><input class="inp" type="email" name="email" value="admin@erp.test" required autocomplete="username"></label>
      <label class="block"><span class="lbl">Password</span><input class="inp" type="password" name="password" value="Password@123" required autocomplete="current-password"></label>
      <button class="btn btn-brand w-full py-3" type="submit">Sign in</button>
      <details class="text-sm text-slate-400">
        <summary class="cursor-pointer hover:text-slate-200">Server address</summary>
        <input id="apiBase" class="inp mt-2" placeholder="http://localhost:8000/api">
      </details>
    </form>
  </div>
</section>

<!-- ================= Application shell ================= -->
<div id="app" class="hidden min-h-screen lg:flex">
  <div id="scrim" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden backdrop-blur-sm"></div>
  <aside id="sidebar" class="fixed lg:sticky top-0 z-40 h-screen w-72 shrink-0 -translate-x-full lg:translate-x-0 transition-transform side-panel flex flex-col">
    <div class="px-6 py-5 flex items-center justify-between border-b border-white/[.06]">
      <div class="font-display text-2xl font-extrabold text-white flex items-center gap-2">
        <span class="brand-mark">W</span> Webpoint One
      </div>
      <button id="closeNav" class="lg:hidden btn-icon" aria-label="Close menu">&times;</button>
    </div>
    <nav id="nav" class="flex-1 overflow-y-auto px-3 py-4 space-y-5"></nav>
    <div class="p-4 border-t border-white/[.06] text-sm">
      <div class="flex items-center gap-3 mb-3">
        <div class="avatar"><span id="whoInitial">W</span></div>
        <div class="min-w-0">
          <div id="whoName" class="font-semibold text-white truncate"></div>
          <div id="whoRole" class="text-slate-400 truncate text-xs"></div>
        </div>
      </div>
      <button id="logout" class="btn btn-ghost w-full">Sign out</button>
    </div>
  </aside>
  <div class="flex-1 min-w-0 flex flex-col bg-bg-base">
    <header class="sticky top-0 z-20 topbar px-4 sm:px-8 py-3 flex items-center gap-3">
      <button id="openNav" class="lg:hidden btn-icon" aria-label="Open menu">☰</button>
      <h1 id="pageTitle" class="font-display text-xl sm:text-2xl font-bold truncate text-white"></h1>
      <div class="ml-auto flex items-center gap-2">
        <button id="bell" class="btn-icon relative" aria-label="Alerts">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="bellDot" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-rose-500 ring-2 ring-bg-base"></span>
        </button>
      </div>
    </header>
    <main id="view" class="p-4 sm:p-8 flex-1 w-full max-w-[1600px] mx-auto"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="fixed bottom-4 right-4 left-4 sm:left-auto z-[100] space-y-2 pointer-events-none"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/schema.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
